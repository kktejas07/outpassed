server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Liveness probe (used by Dokploy / load balancers).
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # App screenshots rarely change; let browsers cache them.
    location /screens/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Single-page behaviour: unknown paths fall back to the landing page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't expose nginx version.
    server_tokens off;
}
