server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Liveness probe (used by Dokploy / load balancers).
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }


    # Web build of the app. Bundles have content hashes, so cache them hard.
    location /app/_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /privacy {
        try_files /privacy.html =404;
    }

    location = /app {
        return 301 /app/;
    }

    # The app routes on the client: any /app/... path loads the app shell.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
    }

    # Everything else falls back to the landing page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't expose nginx version.
    server_tokens off;
}
