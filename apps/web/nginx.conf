server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Liveness probe (used by Dokploy / load balancers).
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Single-page behaviour: unknown paths fall back to the placeholder page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't expose nginx version.
    server_tokens off;
}
